<svg xmlns="http://www.w3.org/2000/svg" width="230" height="110" viewBox="0 0 230 110" role="img" aria-labelledby="title desc">
  <title id="title">Equal distances on a Voronoi boundary</title>
  <desc id="desc">Seeds A and B are on a horizontal line. A vertical blue boundary bisects the segment at a right angle. Point P lies on the boundary. The dotted segments from P to A and from P to B are equal in length.</desc>
  <rect width="230" height="110" fill="white"/>
  <path d="M55 79 H175" fill="none" stroke="#757575" stroke-width="1"/>
  <path d="M55 79 L115 23 L175 79" fill="none" stroke="#282828" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
  <path d="M115 6 V101" fill="none" stroke="#214fb5" stroke-width="2"/>
  <path d="M115 72 H122 V79" fill="none" stroke="#494949" stroke-width="1"/>
  <g fill="#181818">
    <circle cx="55" cy="79" r="3.4"/>
    <circle cx="175" cy="79" r="3.4"/>
    <circle cx="115" cy="23" r="3.4"/>
  </g>
  <g fill="#181818" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">
    <text x="50" y="99">A</text>
    <text x="170" y="99">B</text>
    <text x="123" y="23">P</text>
  </g>
</svg>

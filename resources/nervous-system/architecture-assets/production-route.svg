<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="296" viewBox="0 0 1040 296" role="img" aria-labelledby="title description">
  <title id="title">Two paths meet at the laser</title>
  <desc id="description">A photograph supplies the artwork that is printed on the board. The chosen size, silhouette, cut style and fixed figures determine the geometry. The laser follows the cut paths on the printed board.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 8" refX="7.4" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 .5 8 4 0 7.5 2.2 4Z" fill="#1e2224"/></marker>
    <style>
      .wire{fill:none;stroke:#1e2224;stroke-width:1.5;marker-end:url(#arrow)}
      .box{fill:white;stroke:#27292c;stroke-width:1.3}
      .title{font:21px Georgia,serif;fill:#151719;text-anchor:middle}
      .desc{font:14px Arial,sans-serif;fill:#41474b;text-anchor:middle}
      .signal{font:italic 16px Georgia,serif;fill:#323941;text-anchor:middle}
      .dot{fill:#c52727}
    </style>
  </defs>
  <rect width="1040" height="296" fill="white"/>
  <g class="wire">
    <path d="M116 126Q154 65 205 65"/>
    <path d="M117 163Q154 222 205 222"/>
    <path d="M381 65H865Q902 65 927 111"/>
    <path d="M381 222H459"/>
    <path d="M655 222H727"/>
    <path d="M854 213Q897 204 929 165"/>
  </g>
  <g class="signal"><text x="486" y="54">artwork on plywood</text><text x="420" y="205">domain</text><text x="692" y="205">seams</text></g>
  <circle cx="87" cy="144" r="39" class="box"/>
  <text x="87" y="151" class="title">Photo</text>
  <rect x="207" y="34" width="173" height="62" class="box"/>
  <text x="293" y="61" class="title">Print artwork</text><text x="293" y="82" class="desc">physical image layer</text>
  <rect x="207" y="185" width="173" height="72" class="box"/>
  <text x="293" y="213" class="title">Set the board</text><text x="293" y="237" class="desc">outline, size, fixed figures</text>
  <rect x="462" y="185" width="192" height="72" class="box"/>
  <text x="558" y="214" class="title">Construct pieces</text><text x="558" y="237" class="desc">one of six cut styles</text>
  <rect x="730" y="190" width="124" height="63" class="box"/>
  <text x="792" y="217" class="title">Cut paths</text><text x="792" y="238" class="desc">geometric lines</text>
  <circle cx="951" cy="139" r="42" fill="#202326"/>
  <text x="951" y="146" class="title" style="fill:white">Laser</text>
  <path d="M951 184v22" stroke="#292c30" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="951" y="232" class="desc">wooden pieces</text>
  <text x="87" y="210" class="desc">JPG or PNG</text>
</svg>

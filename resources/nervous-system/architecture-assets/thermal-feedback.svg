<svg xmlns="http://www.w3.org/2000/svg" width="820" height="291" viewBox="0 0 820 291" role="img" aria-labelledby="thermal-title thermal-description">
  <title id="thermal-title">Why one part of a growing seam forms a branch</title>
  <desc id="thermal-description">A protruding tip reaches farther into supercooled material, which favors further advance. As the front advances, freezing releases heat. Heat diffuses to the flanks faster than the front moves, warming them and slowing nearby growth. The plus marks a reinforcing influence. The minus marks inhibition.</desc>
  <metadata>Source: Jesse Louis-Rosenberg, Alec Resnick and Jessica Rosenkrantz, Multiphase Numerical Modeling of Dendritic Solidification for Jigsaw Puzzle Generation (2012), section 3.1, equations 5–7 and figure 2. https://n-e-r-v-o-u-s.com/education/papers/nervousSystem_2012-jigsaw-puzzle-paper.pdf</metadata>
  <defs>
    <marker id="thermal-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0 0 9 5 0 10 2.2 5Z" fill="#202124"/>
    </marker>
    <style>
      .wire{fill:none;stroke:#202124;stroke-width:1.8;marker-end:url(#thermal-arrow)}
      .node{fill:#fff;stroke:#2c2c2c;stroke-width:1.2}
      .name{font:24px Georgia,"Times New Roman",serif;fill:#171717;text-anchor:middle}
      .detail{font:14px Arial,Helvetica,sans-serif;fill:#484848;text-anchor:middle}
      .action{font:italic 17px Georgia,"Times New Roman",serif;fill:#292929;text-anchor:middle}
      .polarity{fill:#fff;stroke:#b52629;stroke-width:1.3}
      .sign{font:bold 17px Arial,Helvetica,sans-serif;fill:#ac1f24;text-anchor:middle}
    </style>
  </defs>
  <rect width="820" height="291" fill="#fff"/>
  <g>
    <path class="wire" d="M235 74 C343 24 474 24 579 72"/>
    <path class="wire" d="M583 104 C477 157 348 157 241 106"/>
    <path class="wire" d="M120 121 C94 153 94 190 122 215"/>
    <path class="wire" d="M240 235 C363 212 458 212 576 235"/>
    <text class="action" x="410" y="26">reaches farther into</text>
    <text class="action" x="410" y="170">favors further advance</text>
    <text class="action" x="209" y="166">releases heat</text>
    <text class="action" x="209" y="187">that spreads sideways</text>
    <text class="action" x="410" y="207">slows growth</text>
    <circle class="polarity" cx="281" cy="134" r="10"/>
    <text class="sign" x="281" y="140">+</text>
    <circle class="polarity" cx="547" cy="214" r="10"/>
    <text class="sign" x="547" y="220">−</text>
  </g>
  <g>
    <rect class="node" x="25" y="54" width="211" height="67" rx="3"/>
    <text class="name" x="130.5" y="83">Advancing tip</text>
    <text class="detail" x="130.5" y="105">a small bulge in the front</text>
    <rect class="node" x="584" y="54" width="211" height="67" rx="3"/>
    <text class="name" x="689.5" y="83">Colder material</text>
    <text class="detail" x="689.5" y="105">ahead of the tip</text>
    <rect class="node" x="25" y="219" width="211" height="64" rx="3"/>
    <text class="name" x="130.5" y="247">Warmer flanks</text>
    <text class="detail" x="130.5" y="268">beside the protrusion</text>
    <rect class="node" x="584" y="219" width="211" height="64" rx="3"/>
    <text class="name" x="689.5" y="247">Neighboring front</text>
    <text class="detail" x="689.5" y="268">advance on either side</text>
  </g>
</svg>

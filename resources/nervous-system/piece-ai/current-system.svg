<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Two existing learning routes in the repository</title><desc id="desc">Lizard and FossilNet use different targets and different geometry back ends.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#176953"/></marker><marker id="warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#ac4633"/></marker></defs><g font-family="Arial, sans-serif"><text x="5" y="18" font-size="12" font-weight="700" fill="#176953" letter-spacing="1.2">LIZARD INFINITY  /  THE NETWORK WARPS A CONNECTED TILING</text><rect x="5" y="34" width="211" height="99" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="18" y="54" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">NETWORK INPUT</text><text x="18" y="81" font-size="18" font-weight="700" fill="#19342f" >Seed + handle grid</text><text x="18" y="104" font-size="14" font-weight="400" fill="#19342f" >Set local drag directions</text><text x="18" y="121" font-size="14" font-weight="400" fill="#19342f" >and spring strengths.</text><rect x="265" y="34" width="208" height="99" rx="9" fill="#e4f0e7" stroke="#bbcabe" stroke-width="1.4"/><text x="278" y="54" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">LEARNED MOTION</text><text x="278" y="81" font-size="18" font-weight="700" fill="#19342f" >Elastic CNN</text><text x="278" y="104" font-size="14" font-weight="400" fill="#19342f" >Seeded drag handles →</text><text x="278" y="121" font-size="14" font-weight="400" fill="#19342f" >2D sheet displacement.</text><rect x="520" y="34" width="211" height="99" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="533" y="54" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">GEOMETRY</text><text x="533" y="81" font-size="18" font-weight="700" fill="#19342f" >Warp the whole sheet</text><text x="533" y="104" font-size="14" font-weight="400" fill="#19342f" >Deform the authored tile,</text><text x="533" y="121" font-size="14" font-weight="400" fill="#19342f" >eyes and spine together.</text><rect x="780" y="34" width="215" height="99" rx="9" fill="#f6ebd5" stroke="#bbcabe" stroke-width="1.4"/><text x="793" y="54" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">OUTPUT</text><text x="793" y="81" font-size="18" font-weight="700" fill="#19342f" >Periodic SVG</text><text x="793" y="104" font-size="14" font-weight="400" fill="#19342f" >Pair reverse edges across</text><text x="793" y="121" font-size="14" font-weight="400" fill="#19342f" >the repeat boundary.</text><path d="M216 84 H258" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M473 84 H513" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M731 84 H773" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="6" y="158" font-size="14" font-weight="400" fill="#50675f" >Three master curves define the six-sided gecko. The CNN learns how a spring sheet relaxes. Its final warp is slope-limited.</text><text x="5" y="201" font-size="12" font-weight="700" fill="#176953" letter-spacing="1.2">FOSSILNET  /  THE NETWORK PROPOSES THE ANIMAL CONTOUR</text><rect x="5" y="217" width="211" height="102" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="18" y="237" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">TRAINING EXAMPLES</text><text x="18" y="264" font-size="18" font-weight="700" fill="#19342f" >Owner’s drawings</text><text x="18" y="287" font-size="14" font-weight="400" fill="#19342f" >13 source silhouettes</text><text x="18" y="304" font-size="14" font-weight="400" fill="#19342f" >and mirrored variants.</text><rect x="265" y="217" width="208" height="102" rx="9" fill="#e4f0e7" stroke="#bbcabe" stroke-width="1.4"/><text x="278" y="237" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">LEARNED SHAPE</text><text x="278" y="264" font-size="18" font-weight="700" fill="#19342f" >Contour decoder</text><text x="278" y="287" font-size="14" font-weight="400" fill="#19342f" >Family + latent → 192</text><text x="278" y="304" font-size="14" font-weight="400" fill="#19342f" >spline control points.</text><rect x="520" y="217" width="211" height="102" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="533" y="237" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">GEOMETRY</text><text x="533" y="264" font-size="18" font-weight="700" fill="#19342f" >Allocate the board</text><text x="533" y="287" font-size="14" font-weight="400" fill="#19342f" >Fit poses, size and latent.</text><text x="533" y="304" font-size="14" font-weight="400" fill="#19342f" >Assign first arrivals.</text><rect x="780" y="217" width="215" height="102" rx="9" fill="#f6ebd5" stroke="#bbcabe" stroke-width="1.4"/><text x="793" y="237" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">OUTPUT</text><text x="793" y="264" font-size="18" font-weight="700" fill="#19342f" >Cut + engraving</text><text x="793" y="287" font-size="14" font-weight="400" fill="#19342f" >Shared seams delimit each</text><text x="793" y="304" font-size="14" font-weight="400" fill="#19342f" >face. Engrave lost detail.</text><path d="M216 268 H258" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M473 268 H513" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M731 268 H773" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="6" y="345" font-size="15" font-weight="700" fill="#19342f" >A decoder can reproduce a drawing and still lose important anatomy when neighboring pieces claim the same space.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img" aria-labelledby="title desc"><title id="title">Scale preserves face count but changes material margins</title><desc id="desc">Seed 387 generated 216 faces at both sizes. All 216 fail the 3 mm neck check at the reference footprint.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#176953"/></marker><marker id="warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#ac4633"/></marker></defs><g font-family="Arial, sans-serif"><text x="5" y="22" font-size="12" font-weight="700" fill="#50675f" letter-spacing="1.3">SEED 387  /  SAME 216-PIECE DESIGN AT TWO PHYSICAL SIZES</text><text x="5" y="62" font-size="20" font-weight="700" fill="#19342f" >500 mm repeat width</text><text x="5" y="88" font-size="15" font-weight="400" fill="#50675f" >Original digital board</text><text x="5" y="142" font-size="20" font-weight="700" fill="#19342f" >298.45 × 236.22 mm</text><text x="5" y="168" font-size="15" font-weight="400" fill="#50675f" >Reference outer footprint</text><rect x="290" y="48" width="350" height="28" rx="4" fill="#edf1eb" stroke="#b7c8be" stroke-width="1.4"/><rect x="290" y="48" width="350" height="28" rx="4" fill="#176953" stroke="#176953" stroke-width="1.4"/><text x="657" y="69" font-size="16" font-weight="700" fill="#176953" >216 / 216 faces</text><rect x="290" y="86" width="16.5" height="11" rx="2" fill="#d8e4d9" stroke="#c0cfc0" stroke-width="1.4"/><rect x="309.5" y="86" width="16.5" height="11" rx="2" fill="#d8e4d9" stroke="#c0cfc0" stroke-width="1.4"/><rect x="329" y="86" width="16.5" height="11" rx="2" fill="#d8e4d9" stroke="#c0cfc0" stroke-width="1.4"/><rect x="348.5" y="86" width="16.5" height="11" rx="2" fill="#d8e4d9" stroke="#c0cfc0"
 >The smaller board still has 216 intact faces after the simulated 0.25 mm kerf.</text><text x="5" y="239" font-size="14" font-weight="400" fill="#50675f" >Neck failure here means the output fails our strict 3 mm width screen. These are digital measurements.</text></g></svg>

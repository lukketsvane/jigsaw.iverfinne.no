<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="286" viewBox="0 0 1000 286" role="img" aria-labelledby="title desc"><title id="title">Moving a seam with a shared travel cost</title><desc id="desc">The tie starts at 50 mm. Doubling travel cost in the first 40 mm moves it to 35 mm with no gap or overlap.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#176953"/></marker><marker id="warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#ac4633"/></marker></defs><g font-family="Arial, sans-serif"><text x="5" y="20" font-size="12" font-weight="700" fill="#50675f" letter-spacing="1.4">ONE-DIMENSIONAL SLICE THROUGH TWO NEIGHBORING CELLS</text><text x="6" y="88" font-size="19" font-weight="700" fill="#19342f" >Uniform travel cost</text><text x="6" y="111" font-size="14" font-weight="400" fill="#50675f" >Cost per mm is 1 everywhere.</text><rect x="243" y="73" width="342.5" height="36" rx="0" fill="#c7dfce" stroke="none" stroke-width="1.4"/><rect x="585.5" y="73" width="342.5" height="36" rx="0" fill="#f2d7b3" stroke="none" stroke-width="1.4"/><text x="259" y="97" font-size="16" font-weight="700" fill="#176953" >A</text><text x="903" y="97" font-size="16" font-weight="700" fill="#804e30" >B</text><line x1="585.5" x2="585.5" y1="65" y2="113" stroke="#ac4633" stroke-width="3"/><circle cx="243" cy="91" r="5" fill="#19342f"/><circle cx="928" cy="91" r="5" fill="#19342f"/><text x="592.5" y="59" font-size="15" font-weight="700" fill="#ac4633" >50 mm</text><text x="6" y="178" font-size="19" font-weight="700" fill="#19342f" >Higher cost near A</text><text x="6" y="201" font-size="14" font-weight="400" fill="#50675f" >Cost doubles from 0 to 40 mm.</text><rect x="243" y="163" width="239.75" height="36" rx="0" fill="#c7dfce" stroke="none" stroke-width="1.4"/><rect x="482.75" y="163" width="445.25" height="36" rx="0" fill="#f2d7b3" stroke="none" stroke-width="1.4"/><text x="259" y="187" font-size="16" font-weight="700" fill="#176953" >A</text><text x="903" y="187" font-size="16" font-weight="700" fill="#804e30" >B</text><line x1="482.75" x2="482.75" y1="155" y2="203" stroke="#ac4633" stroke-width="3"/><circle cx="243" cy="181" r="5" fill="#19342f"/><circle cx="928" cy="181" r="5" fill="#19342f"/><text x="489.75" y="149" font-size="15" font-weight="700" fill="#ac4633" >35 mm</text><line x1="585.5" x2="585.5" y1="114" y2="205" stroke="#718379" stroke-width="1.2" stroke-dasharray="3 5"/><path d="M580 130 H491" fill="none" stroke="#ac4633" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm)"/><text x="627" y="137" font-size="15" font-weight="700" fill="#ac4633" >15 mm of territory changes hands</text><text x="243" y="230" font-size="14" font-weight="700" fill="#19342f" >Seed A · 0 mm</text><text x="928" y="230" font-size="14" font-weight="700" fill="#19342f" text-anchor="end">Seed B · 100 mm</text><text x="6" y="273" font-size="17" font-weight="700" fill="#19342f" >At the new seam, each trip costs 70 units. A travels 35 × 2. B travels (60 × 1) + (5 × 2).</text></g></svg>

  <title id="title">How one foreleg makes two puzzle boundaries</title>
  <desc id="desc">A jade lizard and its pale orange neighbor share a coral curved edge between junctions P and Q. An enlargement labels the two junctions. Piece A follows the edge from P to Q; piece B follows exactly the same edge from Q to P. The laser uses a single centerline.</desc>

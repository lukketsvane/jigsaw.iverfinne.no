<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="344" viewBox="0 0 1000 344" role="img" aria-labelledby="title desc"><title id="title">How a prompt reshapes a shared border</title><desc id="desc">Forward solution, differentiable rendering and semantic feedback in Generative Whimsy Jigsaws.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#176953"/></marker><marker id="warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#ac4633"/></marker></defs><g font-family="Arial, sans-serif"><text x="6" y="19" font-size="12" font-weight="700" fill="#50675f" letter-spacing="1.5">FORWARD PASS  /  ONE PUZZLE</text><rect x="5" y="38" width="217" height="104" rx="9" fill="#e4f0e7" stroke="#bbcabe" stroke-width="1.4"/><text x="18" y="58" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">REPRESENTATION</text><text x="18" y="85" font-size="18" font-weight="700" fill="#19342f" >Neural field</text><text x="18" y="108" font-size="14" font-weight="400" fill="#19342f" >Position (x, y) maps to</text><text x="18" y="125" font-size="14" font-weight="400" fill="#19342f" >positive travel cost.</text><rect x="265" y="38" width="202" height="104" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="278" y="58" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">DISTANCE</text><text x="278" y="85" font-size="18" font-weight="700" fill="#19342f" >Eikonal solver</text><text x="278" y="108" font-size="14" font-weight="400" fill="#19342f" >One travel-time field</text><text x="278" y="125" font-size="14" font-weight="400" fill="#19342f" >per piece seed.</text><rect x="510" y="38" width="219" height="104" rx="9" fill="#e4f0e7" stroke="#bbcabe" stroke-width="1.4"/><text x="523" y="58" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">PARTITION</text><text x="523" y="85" font-size="18" font-weight="700" fill="#19342f" >Soft ownership</text><text x="523" y="108" font-size="14" font-weight="400" fill="#19342f" >Softmin maps arrival times</text><text x="523" y="125" font-size="14" font-weight="400" fill="#19342f" >to soft ownership masks.</text><rect x="773" y="38" width="221" height="104" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="786" y="58" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">OBSERVATION</text><text x="786" y="85" font-size="18" font-weight="700" fill="#19342f" >Render each cell</text><text x="786" y="108" font-size="14" font-weight="400" fill="#19342f" >Show each piece and the</text><text x="786" y="125" font-size="14" font-weight="400" fill="#19342f" >overall silhouette.</text><path d="M222 92 H259" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M467 92 H504" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M729 92 H767" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="544" y="194" width="237" height="103" rx="9" fill="#fae8df" stroke="#bbcabe" stroke-width="1.4"/><text x="557" y="214" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">SEMANTIC SIGNAL</text><text x="557" y="241" font-size="18" font-weight="700" fill="#19342f" >Diffusion guidance</text><text x="557" y="264" font-size="14" font-weight="400" fill="#19342f" >Compare rendered cells</text><text x="557" y="281" font-size="14" font-weight="400" fill="#19342f" >with their assigned prompts.</text><rect x="224" y="194" width="240" height="103" rx="9" fill="#f6ebd5" stroke="#bbcabe" stroke-width="1.4"/><text x="237" y="214" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">DIFFERENTIATION</text><text x="237" y="241" font-size="18" font-weight="700" fill="#19342f" >Adjoint gradient</text><text x="237" y="264" font-size="14" font-weight="400" fill="#19342f" >Update field, seeds and</text><text x="237" y="281" font-size="14" font-weight="400" fill="#19342f" >render orientations.</text><path d="M884 142 V244 H787" fill="none" stroke="#ac4633" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm)"/><path d="M544 244 H470" fill="none" stroke="#ac4633" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm)"/><path d="M224 244 H115 V148" fill="none" stroke="#ac4633" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm)"/><text x="810" y="287" font-size="14" font-weight="700" fill="#19342f" >Text prompts</text><path d="M870 270 V264 H788" fill="none" stroke="#176953" stroke-width="2.1" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="6" y="327" font-size="16" font-weight="700" fill="#19342f" >At a seam the two lowest travel times tie. Moving the field changes both neighbors together.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="354" viewBox="0 0 1000 354" role="img" aria-labelledby="title desc"><title id="title">Proposed shared-edge learning and test loop</title><desc id="desc">The proposed model edits seams from both neighboring outlines before exact reimport and physical feedback.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#176953"/></marker><marker id="warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 9 5 L 0 10 z" fill="#ac4633"/></marker></defs><g font-family="Arial, sans-serif"><rect x="5" y="19" width="212" height="102" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="18" y="39" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">USER + MATERIAL</text><text x="18" y="66" font-size="18" font-weight="700" fill="#19342f" >Design brief</text><text x="18" y="89" font-size="14" font-weight="400" fill="#19342f" >Motif landmarks, size in</text><text x="18" y="106" font-size="14" font-weight="400" fill="#19342f" >mm, kerf and stock.</text><rect x="265" y="19" width="210" height="102" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="278" y="39" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">TOPOLOGY</text><text x="278" y="66" font-size="18" font-weight="700" fill="#19342f" >Piece adjacency</text><text x="278" y="89" font-size="14" font-weight="400" fill="#19342f" >Seed a valid periodic tiling.</text><text x="278" y="106" font-size="14" font-weight="400" fill="#19342f" >Index each shared edge.</text><rect x="524" y="19" width="212" height="102" rx="9" fill="#e4f0e7" stroke="#bbcabe" stroke-width="1.4"/><text x="537" y="39" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">TRAINABLE</text><text x="537" y="66" font-size="18" font-weight="700" fill="#19342f" >Edge proposer</text><text x="537" y="89" font-size="14" font-weight="400" fill="#19342f" >Read both incident faces.</text><text x="537" y="106" font-size="14" font-weight="400" fill="#19342f" >Predict joint seam edits.</text><rect x="782" y="19" width="211" height="102" rx="9" fill="#faf8f0" stroke="#bbcabe" stroke-width="1.4"/><text x="795" y="39" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">CONSTRAINTS</text><text x="795" y="66" font-size="18" font-weight="700" fill="#19342f" >Rebuild both faces</text><text x="795" y="89" font-size="14" font-weight="400" fill="#19342f" >Tie endpoints and wraps.</text><text x="795" y="106" font-size="14" font-weight="400" fill="#19342f" >Bound deformation.</text><path d="M217 69 H258" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M475 69 H517" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M736 69 H775" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="782" y="181" width="211" height="102" rx="9" fill="#f6ebd5" stroke="#bbcabe" stroke-width="1.4"/><text x="795" y="201" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">INDEPENDENT CHECK</text><text x="795" y="228" font-size="18" font-weight="700" fill="#19342f" >Reopen the cut SVG</text><text x="795" y="251" font-size="14" font-weight="400" fill="#19342f" >Measure every face at</text><text x="795" y="268" font-size="14" font-weight="400" fill="#19342f" >its actual cutting size.</text><rect x="469" y="181" width="230" height="102" rx="9" fill="#e4f0e7" stroke="#bbcabe" stroke-width="1.4"/><text x="482" y="201" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">PASS</text><text x="482" y="228" font-size="18" font-weight="700" fill="#19342f" >Make a test board</text><text x="482" y="251" font-size="14" font-weight="400" fill="#19342f" >Print and engrave. Cut,</text><text x="482" y="268" font-size="14" font-weight="400" fill="#19342f" >measure, blind-test fit.</text><rect x="163" y="181" width="228" height="102" rx="9" fill="#fae8df" stroke="#bbcabe" stroke-width="1.4"/><text x="176" y="201" font-size="11" font-weight="700" fill="#50675f" letter-spacing="1.2">TRAINING RECORD</text><text x="176" y="228" font-size="18" font-weight="700" fill="#19342f" >Keep the failures</text><text x="176" y="251" font-size="14" font-weight="400" fill="#19342f" >Log broken features and</text><text x="176" y="268" font-size="14" font-weight="400" fill="#19342f" >plausible wrong mates.</text><path d="M888 121 V174" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M782 230 H706" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M469 230 H399" fill="none" stroke="#176953" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M888 283 V309 H278 V290" fill="none" stroke="#ac4633" stroke-width="2.1" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm)"/><text x="520" y="301" font-size="13" font-weight="700" fill="#ac4633" >Failed geometry checks</text><path d="M277 181 V153 H630 V128" fill="none" stroke="#ac4633" stroke-width="2.1" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#warm)"/><text x="314" y="146" font-size="13" font-weight="700" fill="#ac4633" >Refit on the training split</text><text x="6" y="341" font-size="15" font-weight="700" fill="#19342f" >An output file is accepted only after reimport. A physical result becomes a label for the next training run.</text></g></svg>

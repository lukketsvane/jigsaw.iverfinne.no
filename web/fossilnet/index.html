  --ghost: #c4c8cd;
  color-scheme: light;

g { fill: none; stroke-linecap: round; stroke-linejoin: round; transition: opacity .7s ease; }

.eng { stroke: var(--engrave); }
.ghost { stroke: var(--ghost); }
.gone { opacity: 0; }
.ghost path { animation: appear .45s ease backwards; }

@media (prefers-reduced-motion: reduce) {

}
</style>

      if (ok[q]) run.push([p[2 * q], p[2 * q + 1]]);
      if (!ok[q] || t === n) {
        let L = 0; for (let a = 1; a < run.length; a++) L += Math.hypot(run[a][0] - run[a - 1][0], run[a][1] - run[a - 1][1]);
        if (L >= 3) lines.push({ xy: run }); run = [];
      }
    }
  });
  return { loops, lines };
}

// ---------------------------------------------------------------- drawing
const fmt = v => (Math.round(v * 100) / 100).toString();
const dline = xy => 'M' + xy.map(p => fmt(p[0]) + ' ' + fmt(p[1])).join('L');
const dpoly = p => { let s = 'M'; for (let i = 0; i < p.length; i += 2) s += (i ? 'L' : '') + fmt(p[i]) + ' ' + fmt(p[i + 1]); return s + 'Z'; };
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

let gen = 0, current = null, board = null, zoom = 1;
const relax = () => new Promise(r => setTimeout(r, 0));
const ticker = me => { let t0 = performance.now(); return async () => { if (performance.now() - t0 > 12) { await relax(); t0 = performance.now(); } return me === gen; }; };
function limits() {
  const r = svg.getBoundingClientRect(), cw = Math.max(240, r.width), ch = Math.max(240, r.height), port = ch > cw;
  const lo = Math.max(1.2, cw / (port ? 390 : 570), ch / (port ? 570 : 390));      // never more than a 570 x 390 mm sheet
  const base = Math.max(3, lo);
  return { cw, ch, lo, base, hi: Math.min(14, 3 * base) };
}
function frame() {                                    // the window is the board, at the scale the pinch or wheel left it
  const { cw, ch, lo, base, hi } = limits(), scale = Math.min(hi, Math.max(lo, base * zoom)); zoom = scale / base;
  return { W: Math.max(40, Math.floor(cw / scale)), H: Math.max(40, Math.floor(ch / scale)), scale };
}
function clear(ms = 700) { for (const g of svg.querySelectorAll('g')) { g.classList.add('gone'); setTimeout(() => g.remove(), ms); } }

async function build(seed, at) {
  const me = ++gen, R = mulberry(seed), live = ticker(me), { W, H, scale } = frame(), px = v => (v / scale).toFixed(3);
  clear(); board = null; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const ghost = el('g', { class: 'ghost', 'stroke-width': px(.8) }, svg), all = [];
  for (let i = 0; i < 24; i++) { all.push(creature(R)); if (!(await live())) return; }
  const unit = all.reduce((a, c) => a + c.sh.area, 0) / all.length, n = Math.max(4, Math.round(.75 * W * H / (34 * 34 * unit)));   // fossil_field.auto_pieces
  while (all.length < n) { all.push(creature(R)); if (!(await live())) return; }
  all.length = n;
  const sum = all.reduce((a, c) => a + c.sh.area, 0), sref = Math.sqrt(.75 * W * H / sum), slo = Math.max(BASE, .75 * sref), shi = Math.max(slo * 1.05, 1.3 * sref);
  const s0 = Math.sqrt(.82 * W * H / sum), B = grid(W, H), pieces = [];
  all.forEach(c => { c.want = Math.min(shi, Math.max(slo, (.86 + .28 * R()) * s0)); });
  all.sort((a, b) => b.want - a.want);
  const put = c => { c.id = pieces.length; pieces.push(c); stamp(B, c, true, true); el('path', { d: dpoly(placed(c.sh, c.p)) }, ghost); };
  for (const c of all) {
    c.id = pieces.length;
    for (const m of [1, .92, .84]) { const s = Math.max(slo, c.want * m); c.p = dock(B, c, s, R); if (c.p || s === slo) break; }
    if (c.p) put(c);
    if (!(await live())) return;
  }
  for (let miss = 0, j = 0; miss < 18; j++) {          // fill what is left with the smallest pieces
    const c = creature(R); c.id = pieces.length; c.p = dock(B, c, slo * (1 + .08 * R()), R);
    if (c.p) { put(c); miss = 0; } else miss++;
    if (!(await live())) return;
  }
  let budget = 700;                                    // ms of latent search: the network bends a creature into the room it has
  for (let sweep = 0; sweep < 3; sweep++) {            // grow every piece into the room around it
    for (const c of pieces) {
      stamp(B, c, false);
      let p = c.p;
      for (let t = 0; t < 6; t++) {
        const q = { x: p.x + .8 * gauss(R), y: p.y + .8 * gauss(R), th: p.th + .05 * gauss(R), s: Math.min(shi, p.s * (1.015 + .03 * R())) };
        if (q.s > p.s && fits(B, c.sh, q.x, q.y, Math.cos(q.th), Math.sin(q.th), q.s, c.id)) p = q;
      }
      if (budget > 0) {
        const t1 = performance.now(), n2 = make(c.z.map((v, i) => v + .12 * STD[i] * gauss(R))), s = Math.min(shi, p.s * 1.01);
        if (n2 && fits(B, n2.sh, p.x, p.y, Math.cos(p.th), Math.sin(p.th), s, c.id)) { Object.assign(c, n2); p = { ...p, s }; }
        budget -= performance.now() - t1;
      }
      c.p = p; stamp(B, c, true);
      if (!(await live())) return;
    }
  }
  board = { W, H, scale, pieces, B, slo, ghost };
  await cut(me, at);
}

async function cut(me, at) {                          // first arrival with the bay rule, spur repair, seams, engraving, drawn in from `at`
  const { W, H, scale, pieces } = board, live = ticker(me), px = v => (v / scale).toFixed(3), polys = pieces.map(c => placed(c.sh, c.p));
  board.ghost.replaceChildren(...polys.map(p => el('path', { d: dpoly(p), style: 'animation:none' })));
  const P = await arrival(polys, W, H, live); if (!P) return;
  connect(P);
  for (let i = 0, only = null; i < 3; i++) { const d = despike(P, only); if (!d.moved) break; only = d.touched; }
  connect(P);
  if (!(await live())) return;
  const arcs = trace(P).map(a => ({ pair: a.pair, xy: a.pair[0] < 0 ? [a.xy[0], a.xy[a.xy.length - 1]] : simplify(smooth(a.xy, .4, a.loop), .02), loop: a.loop }));
  const { loops, lines } = engraving(P, pieces, polys);
  if (!(await live())) return;
  const [ox, oy] = at ? local(at[0], at[1]) : [W / 2, H / 2], far = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy));
  const eng = el('g', { class: 'eng', 'stroke-width': px(.75) });
  for (const l of lines) el('path', { d: dline(l.xy) }, eng);
  for (const p of loops) el('path', { d: dpoly(p) }, eng);
  const cutg = el('g', { class: 'cut', 'stroke-width': px(1.1) });
  for (const a of arcs) {
    const m = a.xy[a.xy.length >> 1], d = Math.hypot(m[0] - ox, m[1] - oy) / far;
    el('path', { d: dline(a.loop ? [...a.xy, a.xy[0]] : a.xy), pathLength: 1, style: `--t:${(.05 + 1.1 * d).toFixed(3)}s` }, cutg);
  }
  const g = board.ghost; svg.append(eng, cutg); g.classList.add('gone'); setTimeout(() => g.remove(), 800);
  current = { W, H, arcs, loops, lines };
}

// ---------------------------------------------------------------- sculpting: a drag carries the creature it starts on across the others, like a smudge
let drag = null;
function grab(at) {
  if (!board) return false;
  ++gen; clear(400);
  const g = el('g', { class: 'ghost', 'stroke-width': (.8 / board.scale).toFixed(3) }, svg);
  const src = board.pieces.reduce((a, c) => Math.hypot(c.p.x - at[0], c.p.y - at[1]) < Math.hypot(a.p.x - at[0], a.p.y - at[1]) ? c : a);
  board.ghost = g; drag = { at, src: src.z.slice(), paths: board.pieces.map(c => el('path', { d: dpoly(placed(c.sh, c.p)), style: 'animation:none' }, g)), moved: new Set() };
  return true;
}
function knead(at) {                                  // ~25 mm of rubbing turns a creature into the carried one; the carried form picks up a little of each
  const step = Math.hypot(at[0] - drag.at[0], at[1] - drag.at[1]); drag.at = at;
  for (const c of board.pieces) {
    const t = Math.min(1, step / 25 * Math.exp(-((c.p.x - at[0]) ** 2 + (c.p.y - at[1]) ** 2) / 2000)); if (t < .01) continue;
    const z = (c.z2 || c.z).slice();
    for (let i = 0; i < ZD; i++) { const v = z[i]; z[i] += t * (drag.src[i] - v); drag.src[i] += .15 * t * (v - drag.src[i]); }
    c.z2 = z; drag.moved.add(c); drag.paths[c.id].setAttribute('d', dpoly(placed({ poly: flatten(decode(z), 3) }, c.p)));
  }
}
async function release(at) {                          // keep every reshaped creature that still holds together and fits, then cut again
  const me = ++gen, B = board.B;
  for (const c of drag.moved) {
    const n2 = make(c.z2); delete c.z2;
    if (!n2) continue;
    stamp(B, c, false); const old = { z: c.z, out: c.out, sh: c.sh, p: c.p }; Object.assign(c, n2);
    let p = c.p, ok = false;
    for (let t = 0; t < 14 && !ok; t++) { ok = fits(B, c.sh, p.x, p.y, Math.cos(p.th), Math.sin(p.th), p.s, c.id); if (!ok) p = { ...p, s: Math.max(board.slo, p.s * .96) }; }
    if (ok) c.p = p; else Object.assign(c, old);
    stamp(B, c, true);
  }
  drag = null;
  await cut(me, at);
}

// ---------------------------------------------------------------- zoom: pinch or wheel scales the sheet under the finger; it is cut again at the new size
let pinch = 1, settle = 0, focus = null;
function magnify(k, client) {
  if (!board) return;
  const { lo, base, hi } = limits(), at = local(client[0], client[1]);
  pinch = Math.max(lo / base / zoom, Math.min(hi / base / zoom, pinch * k)); focus = client;
  for (const g of svg.querySelectorAll('g')) g.setAttribute('transform', `translate(${at[0]} ${at[1]}) scale(${pinch}) translate(${-at[0]} ${-at[1]})`);
  clearTimeout(settle); settle = setTimeout(() => { zoom *= pinch; pinch = 1; build(seed(), focus); }, 420);
}

// ---------------------------------------------------------------- export: cut red, engraving blue, 1:1 mm (fossil-field-production.svg)
let downloads = null;
if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloads = d; }, () => {});
function production() {
  const { W, H, arcs, loops, lines } = current;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}">\n`
    + `<g id="engrave" fill="none" stroke="#0000ff" stroke-width="0.1">${loops.map(p => `<path d="${dpoly(p)}"/>`).join('')}${lines.map(l => `<path d="${dline(l.xy)}"/>`).join('')}</g>`
    + `<g id="cut" fill="none" stroke="#ff0000" stroke-width="0.1" stroke-linecap="round" stroke-linejoin="round">${arcs.map(a => `<path d="${dline(a.loop ? [...a.xy, a.xy[0]] : a.xy)}"/>`).join('')}</g>\n</svg>`;
}
async function save() {
  if (!current) return;
  const name = `fossilnet-${current.W}x${current.H}mm.svg`, data = production();
  if (downloads) { try { await downloads.save({ filename: name, data }); } catch (e) { /* declined or unavailable */ } return; }
  if (window.claude) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'image/svg+xml' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ---------------------------------------------------------------- no visible controls: tap, drag, pinch or wheel; S saves
const seed = () => (Math.random() * 2 ** 31) >>> 0;
const local = (x, y) => { const r = svg.getBoundingClientRect(), b = svg.viewBox.baseVal, k = Math.min(r.width / b.width, r.height / b.height); return [(x - r.left - (r.width - b.width * k) / 2) / k, (y - r.top - (r.height - b.height * k) / 2) / k]; };
const ptrs = new Map(); let gest = null;
document.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) gest = { kind: 'tap', x: e.clientX, y: e.clientY };
  else if (ptrs.size === 2) { if (drag) release(); const [a, b] = [...ptrs.values()]; gest = { kind: 'pinch', d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; }
});
document.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !gest) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (gest.kind === 'tap' && Math.hypot(e.clientX - gest.x, e.clientY - gest.y) > 6) gest.kind = grab(local(gest.x, gest.y)) ? 'drag' : 'none';
  if (gest.kind === 'drag' && drag) { drag.next = local(e.clientX, e.clientY); if (!drag.raf) drag.raf = requestAnimationFrame(() => { if (drag) { drag.raf = 0; knead(drag.next); } }); }
  if (gest.kind === 'pinch' && ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); magnify(d / gest.d, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]); gest.d = d; }
});
const up = e => {
  if (!ptrs.delete(e.pointerId) || !gest) return;
  if (gest.kind === 'tap' && e.type === 'pointerup') build(seed(), [e.clientX, e.clientY]);
  else if (gest.kind === 'drag' && drag) release([e.clientX, e.clientY]);
  if (gest.kind !== 'pinch' || !ptrs.size) gest = ptrs.size ? { kind: 'none' } : null;
};
document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
addEventListener('wheel', e => { e.preventDefault(); magnify(Math.exp(-e.deltaY * .0015), [e.clientX, e.clientY]); }, { passive: false });
let resized = 0;
addEventListener('resize', () => { clearTimeout(resized); resized = setTimeout(() => { const f = frame(), b = svg.viewBox.baseVal; if (Math.abs(f.W - b.width) > .12 * b.width || Math.abs(f.H - b.height) > .12 * b.height) build(seed()); }, 300); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); save(); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); build(seed()); }
});
build(seed());
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound in Pieces / Design</title>
<meta name="description" content="Design your own SOUND IN PIECES board: every piece a logo, your image on top.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="In Pieces">
<style>
/* the window holds the board, 368 x 368 mm of pieces; nothing else on the page */
html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#board{display:block;overflow:hidden;width:min(calc(100vw - 2*max(16px,env(safe-area-inset-left),env(safe-area-inset-right))),calc(100svh - 2*max(16px,env(safe-area-inset-top),env(safe-area-inset-bottom))));aspect-ratio:1;height:auto}
#print{transition:opacity 1.2s cubic-bezier(.2,.7,0,1),filter .25s}
.dev #print{opacity:.22}.hold #print{filter:invert(1)}
g{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .7s ease}
.ghost{stroke:#ccf44b;stroke-opacity:.75}.ghost path{animation:appear .45s ease backwards}
.cut{stroke:#ccf44b;transition:stroke 1.4s ease,stroke-opacity 1.4s ease,opacity .7s ease}.cut.set{stroke:#000;stroke-opacity:.8}
.cut path{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .5s cubic-bezier(.5,0,.3,1) var(--t,0s) forwards}
.gone{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ghost path{animation:none}.cut path{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<svg id="board" viewBox="0 0 368 368" role="img" aria-label="A jigsaw where every piece is an Aphex Twin logo. Tap for a new cut, drag to smudge the logos, pinch for larger or smaller pieces, press and hold for your own image, two-finger tap to save the cut file.">
  <image id="print" href="img/print-1600.webp" width="368" height="368" preserveAspectRatio="xMidYMid slice"/>
</svg>
<input id="pick" type="file" accept="image/*" hidden>
<script src="js/pathnet-logo.js"></script>
<script src="js/designer.js"></script>
</body>
</html>

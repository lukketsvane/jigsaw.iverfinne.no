/*
VOICE   the SOUND IN PIECES scroll: black, quiet, images first
IDEA    a specimen catalogue; every label is a measurement
PICTURE the renders, plus the real cut geometry drawn live
COLOUR  black, two greys of ink; lime only where a piece is touched
TYPE    IBM Plex Mono only, as in the Figma
LAYOUT  the 1440 Figma proportions, scaled fluidly
*/
@font-face{font-family:Plex;src:url(fonts/plex-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
:root{color-scheme:dark;--ink:#edf0f2;--dim:#858c91;--lime:#ccf44b;
--g:clamp(20px,4.45vw,64px);--gl:max(var(--g),env(safe-area-inset-left));--gr:max(var(--g),env(safe-area-inset-right));
--l:clamp(11.5px,.5vw + 7.8px,15px)}
*,*::before,*::after{box-sizing:border-box;min-width:0}
html{background:#000;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#000;color:var(--ink);font:400 var(--l)/1.3 Plex,ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;z-index:9;inset:0 0 auto;height:env(safe-area-inset-top);background:#000}
main{overflow-x:clip}
img,video,svg{display:block;max-width:100%}img,video{height:auto}
figure,p{margin:0}
::selection{background:var(--lime);color:#000}
.js img.f{opacity:0;transition:opacity 1s cubic-bezier(.2,.7,0,1)}.js img.f.ld{opacity:1}
section{position:relative;padding:calc(clamp(26px,3vw,44px) + env(safe-area-inset-top)) var(--gr) clamp(36px,4.2vw,60px) var(--gl)}
section:last-child{padding-bottom:calc(clamp(64px,8vw,120px) + env(safe-area-inset-bottom))}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:16px;white-space:nowrap}
.d{color:var(--dim)}
.pl{margin:clamp(26px,3.6vw,52px) auto clamp(22px,2.6vw,38px)}
.pl img,.pl video,.pl svg{width:100%}
.bleed{margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr))}
@media (prefers-reduced-motion:reduce){.js img.f,.stage img{transition:none}}

/* object */
.hero{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
.hero .t{font-size:clamp(14px,.6vw + 11.4px,20px)}
.studies-link{color:var(--dim);text-underline-offset:.25em;padding-block:8px;margin-block:-8px}
.studies-link:hover{color:var(--ink)}
.studies-link:focus-visible,.studies-grid a:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
.hero figure{display:grid;place-items:center;grid-template-columns:minmax(0,1fr);overflow:hidden;margin:clamp(20px,3vh,48px) calc(-1*var(--gr)) clamp(20px,3vh,48px) calc(-1*var(--gl))}
.hero figure img{width:min(86vw,1240px);max-height:calc(100svh - 160px);object-fit:contain}
.hero .r:last-child{display:grid;grid-template-columns:1fr auto 1fr}
.hero .r:last-child :nth-child(2){text-align:center}.hero .r:last-child :last-child{text-align:right}
@media (max-width:700px){.hero figure img{width:116vw;max-width:none;max-height:none;justify-self:start;margin-inline:calc(50% - 58vw)}}
.hero figure{position:relative}
.gl{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.4s cubic-bezier(.2,.7,0,1);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gl.orbit{cursor:grabbing}.live .gl{opacity:1}

.live-cut{width:min(100%,84svh,1056px)}
#board{width:100%;aspect-ratio:1;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
#board[data-interactive]{cursor:crosshair}
#board:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
#board image{transition:opacity 1.2s ease}
#board.dev image{opacity:.22}
#board g{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .7s ease}
#board .ghost{stroke:var(--lime);stroke-opacity:.75}
#board .ghost path{animation:silhouette-in .45s ease backwards}
#board .cut{stroke:var(--lime);transition:stroke 1.4s ease,stroke-opacity 1.4s ease,opacity .7s ease}
#board .cut.set{stroke:#000;stroke-opacity:.8}
#board .cut path{stroke-dasharray:1 1;stroke-dashoffset:1;animation:trace-cut .5s cubic-bezier(.5,0,.3,1) var(--t,0s) forwards}
#board .gone{opacity:0}
@keyframes trace-cut{to{stroke-dashoffset:0}}
@keyframes silhouette-in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #board image,#board g,#board .cut{transition:none}
  #board .ghost path,#board .cut path{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
}

#specimen button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation}
#specimen button:focus-visible{outline:2px solid var(--lime);outline-offset:4px}

/* seed 22: the three stages change as you scroll */
.seq{height:300svh;padding:0}
.pin{position:sticky;top:0;height:100svh;display:grid;place-items:center;padding:calc(clamp(26px,3vw,44px) + env(safe-area-inset-top)) var(--gr) calc(clamp(26px,3vw,44px) + env(safe-area-inset-bottom)) var(--gl)}
.stage{position:relative;width:min(100%,calc(100svh - 120px),1100px);aspect-ratio:1}
.stage img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .7s cubic-bezier(.2,.7,0,1)}
.stage img.on{opacity:1}

/* cut field + atlas, live from the cut file */
.field{aspect-ratio:1;cursor:crosshair}
.field path{fill:#000;stroke:var(--ink);stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .35s}
.specs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(6px,1vw,14px) 0;cursor:crosshair}
@media (min-width:760px){.specs{grid-template-columns:repeat(13,minmax(0,1fr))}}
.sp{display:grid;justify-items:center;gap:3px}
.sp svg{width:78%;aspect-ratio:1;fill:var(--ink);transition:fill .3s}
.sp span{font-size:clamp(8px,.35vw + 5.5px,10px);color:var(--dim)}
@media (hover:hover){.field path:hover{fill:#2b3035}.sp:hover svg{fill:#fff}}
.field path.on{fill:var(--lime);stroke:var(--lime)}.sp.on svg{fill:var(--lime)}.sp.on span{color:var(--lime)}

/* widths from the 1440 Figma frame */
.w710{max-width:710px;width:49.3vw}.w956{max-width:956px;width:66.4vw}.w1056{max-width:1056px;width:73.3vw}
.w1168{max-width:1168px;width:81.1vw}.w1210{max-width:1210px;width:84vw}.w1320{max-width:1320px;width:91.7vw}
@media (max-width:700px){.w710{width:84vw}.w956,.w1056,.w1168,.w1210,.w1320{width:100%}}
.ed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.4vw,20px)}
@media (max-width:700px){.ed{grid-template-columns:minmax(0,1fr)}}
.fa{width:55.6%}.fb{width:60.8%;margin-left:auto}.ang{width:82.4%;margin-left:auto}
@media (max-width:700px){.fa,.fb,.ang{width:100%}}

#studies{max-width:1600px;margin-inline:auto}
#studies h2{font:inherit;margin:0}
.studies-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;gap:clamp(18px,3vw,48px)}
.studies-grid a{display:block;cursor:zoom-in}
.studies-grid img{width:100%}
@media (max-width:700px){.studies-grid{grid-template-columns:minmax(0,1fr)}}

/* film grain over everything, a few frames a second */
body::after{content:"";position:fixed;z-index:10;inset:-120px;pointer-events:none;background:url(img/grain.png);animation:grain 1.1s steps(1) infinite}
@keyframes grain{0%{transform:translate(0,0)}17%{transform:translate(-61px,37px)}33%{transform:translate(43px,-89px)}50%{transform:translate(-97px,-23px)}67%{transform:translate(79px,71px)}83%{transform:translate(-17px,101px)}}
@media (prefers-reduced-motion:reduce){body::after{animation:none}}

/* the door: the logo network, breathing */
.door{display:grid;place-items:center;min-height:100svh}
.door a{display:block;width:min(54vmin,440px);aspect-ratio:1;-webkit-tap-highlight-color:transparent}
.door svg{width:100%;height:100%;overflow:visible}.door path{fill:var(--lime)}

function whenNear(element,start){
